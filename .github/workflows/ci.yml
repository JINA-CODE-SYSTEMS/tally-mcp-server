name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Build & Type Check
  # ──────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile (strict)
        run: npx tsc --noEmit

      - name: Full build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  # ──────────────────────────────────────────────
  # Secret Leak Detection
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  # ──────────────────────────────────────────────
  # File Safety Checks
  # ──────────────────────────────────────────────
  file-safety:
    name: File Safety Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required: the check below diffs against origin/main. On the default
          # shallow clone that ref is absent, git errors, stderr is discarded and
          # the gate silently passes regardless of what the PR contains.
          fetch-depth: 0

      - name: Block sensitive files
        run: |
          BLOCKED=0
          # Check for log files
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -iE '\.(log|env|pem|key|pfx|p12)$'; then
            echo "::error::Sensitive file types detected in PR. Remove them before merging."
            BLOCKED=1
          fi
          # The Claude plugin is built from plugin/ during the Pages deploy. A committed archive
          # is unreviewable — diffs are meaningless and its contents cannot be code-reviewed.
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -iE '\.(plugin|zip)$'; then
            echo "::error::Committed archive detected. Build it from source instead — see plugin/ and pages.yml."
            BLOCKED=1
          fi
          # Check for common secret patterns in added lines
          if git diff origin/main...HEAD | grep -iE '^\+.*(password|secret|token|api_key)\s*[:=]\s*.{8,}'; then
            echo "::warning::Possible hardcoded secret detected. Please review."
          fi
          if [ "$BLOCKED" -eq 1 ]; then exit 1; fi

  # ──────────────────────────────────────────────
  # Windows Sources
  # ──────────────────────────────────────────────
  # The Windows half of this project had no CI at all: the installer, the PowerShell agent and
  # TallyUI.cs were only ever built on a maintainer's desktop. This job keeps the Windows sources
  # honest on every PR. It deliberately does NOT build the full installer — that downloads a
  # portable Node, NSSM and cloudflared and runs Inno Setup, which is far too slow per-PR. The
  # complete installer build runs on tag push in release.yml.
  windows-sources:
    name: Windows Sources
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile TallyUI.dll
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /nologo /target:library /reference:System.Drawing.dll `
                 /out:scripts\TallyUI.dll scripts\TallyUI.cs
          if ($LASTEXITCODE -ne 0) { throw 'TallyUI.dll compile failed' }
          Write-Host "TallyUI.dll built: $((Get-Item scripts\TallyUI.dll).Length) bytes"

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $bad += $_.FullName
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($bad.Count) { throw "$($bad.Count) PowerShell file(s) failed to parse" }
          Write-Host 'All PowerShell scripts parse cleanly'

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # Errors fail the build; warnings are surfaced but tolerated for now, so this can be
          # adopted without a large up-front cleanup. Tighten to Warning once the backlog is clear.
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($issues.Count) error(s)"
          }
          Write-Host 'No PSScriptAnalyzer errors'

