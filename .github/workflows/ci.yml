name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # Build & Type Check
  # ──────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile (strict)
        run: npx tsc --noEmit

      - name: Full build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  # ──────────────────────────────────────────────
  # Secret Leak Detection
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  # ──────────────────────────────────────────────
  # File Safety Checks
  # ──────────────────────────────────────────────
  file-safety:
    name: File Safety Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required: the check below diffs against origin/main. On the default
          # shallow clone that ref is absent, git errors, stderr is discarded and
          # the gate silently passes regardless of what the PR contains.
          fetch-depth: 0

      - name: Block sensitive files
        run: |
          BLOCKED=0
          # Check for log files
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -iE '\.(log|env|pem|key|pfx|p12)$'; then
            echo "::error::Sensitive file types detected in PR. Remove them before merging."
            BLOCKED=1
          fi
          # The Claude plugin is built from plugin/ during the Pages deploy. A committed archive
          # is unreviewable — diffs are meaningless and its contents cannot be code-reviewed.
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -iE '\.(plugin|zip)$'; then
            echo "::error::Committed archive detected. Build it from source instead — see plugin/ and pages.yml."
            BLOCKED=1
          fi
          # Check for common secret patterns in added lines
          if git diff origin/main...HEAD | grep -iE '^\+.*(password|secret|token|api_key)\s*[:=]\s*.{8,}'; then
            echo "::warning::Possible hardcoded secret detected. Please review."
          fi
          if [ "$BLOCKED" -eq 1 ]; then exit 1; fi

  # ──────────────────────────────────────────────
  # Windows Sources
  # ──────────────────────────────────────────────
  # The Windows half of this project had no CI at all: the installer, the PowerShell agent and
  # TallyUI.cs were only ever built on a maintainer's desktop. This job keeps the Windows sources
  # honest on every PR. It deliberately does NOT build the full installer — that downloads a
  # portable Node, NSSM and cloudflared and runs Inno Setup, which is far too slow per-PR. The
  # complete installer build runs on tag push in release.yml.
  windows-sources:
    name: Windows Sources
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile TallyUI.dll
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /nologo /target:library /reference:System.Drawing.dll `
                 /out:scripts\TallyUI.dll scripts\TallyUI.cs
          if ($LASTEXITCODE -ne 0) { throw 'TallyUI.dll compile failed' }
          Write-Host "TallyUI.dll built: $((Get-Item scripts\TallyUI.dll).Length) bytes"

      # Customers run Windows PowerShell 5.1 - it is what the service, the scheduled tasks and the
      # installer shell out to. CI used to parse these scripts only with pwsh 7, which reads files
      # as UTF-8 and accepts syntax 5.1 rejects; that is how an em dash in a BOM-less deploy.ps1
      # sat unparseable on main while every check stayed green. 5.1 is the gate that matters, so it
      # runs first, and it checks encoding as well as syntax.
      - name: PowerShell 5.1 compatibility (syntax + encoding)
        shell: powershell
        run: .\scripts\check-powershell-compat.ps1

      # The scripts also have to keep working under pwsh 7, which maintainers and the tray use.
      - name: PowerShell 7 syntax check
        shell: pwsh
        run: .\scripts\check-powershell-compat.ps1 -ParseOnly

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # Errors fail the build; warnings are surfaced but tolerated for now, so this can be
          # adopted without a large up-front cleanup. Tighten to Warning once the backlog is clear.
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($issues.Count) error(s)"
          }
          Write-Host 'No PSScriptAnalyzer errors'

      # The installer's [Code] section is Pascal Script and nothing in CI ever compiled it, so a
      # broken wizard function or a dangling {code:...} reference could only be caught by cutting a
      # release. This compiles the real .iss against a tree of stub files - seconds, no downloads.
      # It does not check that the declared source files exist; the release build does that.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Inno Setup script compiles
        shell: pwsh
        run: .\scripts\installer\check-iss.ps1


      # Regression test for the transport seam (PR #190). The one-shot (-Once) path is how the MCP
      # server drives Tally in-session, and it MUST work while the companion watch-mode agent is
      # running - that is the normal state of every production box. An earlier revision took the
      # single-instance mutex before branching on -Once, so every one-shot child was refused with a
      # plain-text line and exit 0; the caller parses stdout as JSON, so that surfaced as a null
      # result indistinguishable from a timeout. This step holds the mutex in the runner's own
      # process (exactly what an installed agent does) and proves a one-shot child still answers.
      - name: One-shot agent answers while a watcher holds the mutex
        shell: pwsh
        run: |
          $mutex = New-Object System.Threading.Mutex($false, 'TallyMCPAgentSingleInstance')
          if (-not $mutex.WaitOne(5000)) { throw 'could not acquire the mutex to simulate a running watcher' }
          try {
            $out = '{"action":"ping","commandId":"ci-oneshot"}' |
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File scripts\tally-gui-agent-v2.ps1 -Once 2>&1 | Out-String

            Write-Host "--- agent stdout ---`n$out--------------------"

            # Mirror parseGuiAgentStdout: take the last complete JSON line, ignoring host chatter.
            $json = $out -split "`r?`n" |
              ForEach-Object { $_.TrimStart([char]0xFEFF).Trim() } |
              Where-Object { $_.StartsWith('{') -and $_.EndsWith('}') } |
              Select-Object -Last 1

            if (-not $json) { throw 'one-shot produced no JSON result while a watcher held the mutex (regression: the single-instance guard is refusing -Once)' }

            $result = $json | ConvertFrom-Json
            if ($result.status -ne 'success')    { throw "one-shot ping returned status '$($result.status)': $($result.message)" }
            if (-not $result.agentVersion)       { throw 'one-shot ping returned no agentVersion' }
            Write-Host "one-shot OK while watcher held the mutex (agentVersion $($result.agentVersion))"
          }
          finally { $mutex.ReleaseMutex(); $mutex.Dispose() }

      # The flip side: the guard must still refuse a second WATCH-mode agent, or two watchers will
      # race on the IPC files and each spawn an overlay.
      - name: A second watch-mode agent is still refused
        shell: pwsh
        run: |
          $mutex = New-Object System.Threading.Mutex($false, 'TallyMCPAgentSingleInstance')
          if (-not $mutex.WaitOne(5000)) { throw 'could not acquire the mutex to simulate a running watcher' }
          try {
            $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                     -File scripts\tally-gui-agent-v2.ps1 -WatchDir $env:RUNNER_TEMP 2>&1 | Out-String
            if ($out -notmatch 'already running') {
              throw "a duplicate watch-mode agent was NOT refused; it printed:`n$out"
            }
            Write-Host 'duplicate watch-mode agent correctly refused'
          }
          finally { $mutex.ReleaseMutex(); $mutex.Dispose() }
