name: Deploy landing page

# Publishes site/ to GitHub Pages (https://claudally.jinacode.systems).
# Enable once in repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugin/**'
      - 'scripts/tray/assets/claudally-logo.png'
      - '.github/workflows/pages.yml'
  # Called directly by release.yml once a release is published. This is a workflow_call rather than
  # a `release: published` trigger because GitHub deliberately suppresses workflow triggers for
  # events raised with GITHUB_TOKEN, to prevent runs cascading. Our releases are created by CI with
  # github.token, so a release trigger would never fire for them — as it did not for v0.2.0, which
  # published while the site kept advertising v0.1.0.
  workflow_call:
  # Kept for releases created BY HAND in the GitHub UI, which are raised under a real user and so do
  # fire this. Harmless alongside workflow_call: the concurrency group below collapses duplicates.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Stage assets kept at their canonical source (no committed duplicates in site/):
      # the brand logo (regenerated from the SVG master) and the Claude plugin, which is BUILT
      # here from plugin/ rather than shipped as a committed archive. -X drops extra file
      # attributes so the output does not churn between runners.
      - name: Stage downloadable assets
        run: |
          cp scripts/tray/assets/claudally-logo.png site/claudally-logo.png
          (cd plugin && zip -r -q -X ../site/tally-feeding.plugin .)
          unzip -l site/tally-feeding.plugin

      # site/index.html ships {{RELEASE_*}} placeholders rather than hardcoded version numbers,
      # so the published page cannot drift from the actual latest release. If no release exists
      # yet, the buttons degrade to the releases listing instead of rendering broken placeholders.
      #
      # On a `release` event, look up THAT release by its tag (#43). Asking for "latest" seconds after
      # publishing still returned the previous release, so the site kept advertising the old version
      # until someone re-ran this by hand. But `published` also fires for a pre-release and for an older
      # release published by hand (a backport), and the site's download button must offer neither: the
      # event tag is used only when it is not a pre-release and is at least as new as "latest" (which
      # may simply not have caught up yet). Push, dispatch and the workflow_call from release.yml (whose
      # event is the caller's push or dispatch) keep the latest lookup. Values reach the script through
      # env, never as expressions expanded inside the script.
      - name: Inject current release details
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RELEASES_URL="https://github.com/$REPO/releases"

          LOOKUP=(gh release view --repo "$REPO" --json tagName,assets)
          if [ "$EVENT_NAME" = "release" ] && [ -n "$EVENT_TAG" ]; then
            if [ "$EVENT_PRERELEASE" = "true" ]; then
              echo "$EVENT_TAG is a pre-release; the site keeps advertising the latest release."
            else
              LATEST_TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
              NEWEST=$(printf '%s\n%s\n' "${LATEST_TAG#v}" "${EVENT_TAG#v}" | sed '/^$/d' | sort -V | tail -n 1)
              if [ -z "$LATEST_TAG" ] || [ "$NEWEST" = "${EVENT_TAG#v}" ]; then
                echo "Triggered by the release of $EVENT_TAG (latest reports ${LATEST_TAG:-none}); using $EVENT_TAG."
                LOOKUP=(gh release view "$EVENT_TAG" --repo "$REPO" --json tagName,assets)
              else
                echo "$EVENT_TAG is older than the latest release $LATEST_TAG; the site keeps advertising $LATEST_TAG."
              fi
            fi
          fi

          if "${LOOKUP[@]}" > /tmp/rel.json 2>/dev/null; then
            TAG=$(jq -r '.tagName' /tmp/rel.json)
            VERSION="${TAG#v}"
            FILE=$(jq -r '[.assets[] | select(.name | endswith(".exe"))][0].name // ""' /tmp/rel.json)
            BYTES=$(jq -r '[.assets[] | select(.name | endswith(".exe"))][0].size // 0' /tmp/rel.json)
            # The installer's own checksum file: a release also carries the extension's .sha256.
            SHA_URL=$(jq -r --arg n "$FILE.sha256" '[.assets[] | select(.name == $n)][0].url // ""' /tmp/rel.json)

            if [ -n "$FILE" ]; then
              DOWNLOAD="$RELEASES_URL/download/$TAG/$FILE"
              # Trailing separator lives with the value, so the line reads correctly whether or
              # not a size is available.
              SIZE="$(awk -v b="$BYTES" 'BEGIN{printf "%.0f MB", b/1048576}') · "
            else
              DOWNLOAD="$RELEASES_URL"; SIZE=""
            fi

            SHA="(published on the release page)"
            if [ -n "$SHA_URL" ]; then
              SHA=$(curl -sSL "$SHA_URL" | awk '{print $1}' | head -1)
            fi
            echo "Injecting $TAG ($FILE, $BYTES bytes)"
          else
            echo "No published release found — pointing the buttons at the releases listing."
            VERSION="latest"; FILE="Claudally-Setup.exe"; DOWNLOAD="$RELEASES_URL"
            SIZE=""; SHA="(published on the release page)"
          fi

          python3 - "$VERSION" "$FILE" "$DOWNLOAD" "$SIZE" "$SHA" <<'PYEOF'
          import sys, pathlib
          version, file, download, size, sha = sys.argv[1:6]
          p = pathlib.Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          for key, value in {
              'RELEASE_VERSION': version,
              'RELEASE_FILE': file,
              'RELEASE_DOWNLOAD': download,
              'RELEASE_SIZE': size,
              'RELEASE_SHA': sha,
          }.items():
              html = html.replace('{{' + key + '}}', value)
          p.write_text(html, encoding='utf-8')
          leftover = [k for k in ('RELEASE_VERSION','RELEASE_FILE','RELEASE_DOWNLOAD','RELEASE_SIZE','RELEASE_SHA')
                      if '{{' + k + '}}' in html]
          if leftover:
              raise SystemExit(f'Unsubstituted placeholders remain: {leftover}')
          print('Placeholders substituted.')
          PYEOF

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
