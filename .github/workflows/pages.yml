name: Deploy landing page

# Publishes site/ to GitHub Pages (https://claudally.jinacode.systems).
# Enable once in repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tally-feeding.plugin'
      - 'scripts/tray/assets/claudally-logo.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Stage assets kept at their canonical source (no committed duplicates in site/):
      # the brand logo (regenerated from the SVG master) and the downloadable Claude plugin.
      - name: Stage downloadable assets
        run: |
          cp scripts/tray/assets/claudally-logo.png site/claudally-logo.png
          cp tally-feeding.plugin site/tally-feeding.plugin

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
